[configuration]
id = "B2SPro"
name = "B2S Pro"
description = "B2S Pro backglass renderer (.B2SPro and legacy .directb2s)"
author = "B2S Pro, built on the VPX B2S plugin"
version = "1.4.0"
link = "https://github.com/KWildman69/B2S-Pro-Plugin"

[libraries]
windows.x86 = "plugin-b2spro.dll"
windows.x64 = "plugin-b2spro64.dll"
linux.x64 = "plugin-b2spro.so"
linux.aarch64 = "plugin-b2spro.so"
macos.x64 = "plugin-b2spro.dylib"
macos.arm64 = "plugin-b2spro.dylib"

[dependencies]
git submodule = "third-party/boost/boost"
git submodule = "third-party/cpp-taskflow"
git submodule = "third-party/freeimage"
git submodule = "third-party/pinmame-shared"
git submodule = "third-party/render"
git submodule = "third-party/renderGL"

[build]
flavors = "linux,macos,windows,win_x86,win_mingw"
linux.name = "Linux x64"
linux.script = "./tools/build_b2s_plugin.sh"
macos.name = "macOS x64 & arm64 (macOS only)"
macos.script = "./tools/build_b2s_plugin.sh"
windows.name = "Windows x64 (MSVC, Windows only)"
windows.script = "./tools/build_b2s_plugin.sh"
win_x86.name = "Windows x86"
win_x86.script = "./tools/build_b2s_plugin.sh x86"
win_mingw.name = "Windows x64 (mingw cross)"
win_mingw.script = "./tools/build_b2s_plugin_windows.sh"
